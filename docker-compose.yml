services:
  db:
    image: postgres:16-alpine
    container_name: rzp_recovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery
      POSTGRES_DB: revenue_recovery
    ports:
      - "5432:5432"
    volumes:
      - rzp_recovery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d revenue_recovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rzp_recovery_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://recovery:recovery@db:5432/revenue_recovery
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in a .env file next to this docker-compose.yml}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LLM_REQUESTS_PER_MINUTE: ${LLM_REQUESTS_PER_MINUTE:-15}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_BACKOFF_BASE_SECONDS: ${LLM_BACKOFF_BASE_SECONDS:-2.0}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: rzp_recovery_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  rzp_recovery_pgdata:
